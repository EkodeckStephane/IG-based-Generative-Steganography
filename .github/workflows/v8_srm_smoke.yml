name: V8 SRM shard smoke
on:
  push:
    branches: [cachin-ig-robust-v8]
    paths:
      - '.github/workflows/v8_srm_smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pillow conseal==2025.11 setuptools
      - name: Reference data and SRM
        run: |
          wget -q -O /tmp/SRM.tar https://dde.binghamton.edu/download/feature_extractors/download/SRM_linux_make_v1.1.tar
          mkdir -p /tmp/srm && tar -xf /tmp/SRM.tar -C /tmp/srm
          wget -q -O /tmp/BOSSBase.zip https://dde.binghamton.edu/download/ImageDB/BOSSbase_1.01.zip
          unzip -q /tmp/BOSSBase.zip -d /tmp/boss
      - name: Build tracked STC
        run: |
          cd research_v8/vendor/pystc_minimal
          cp -f common.cpp common.h stc_embed_c.cpp stc_embed_c.h stc_extract_c.cpp stc_extract_c.h stc_interface.cpp stc_interface.h stc_ml_c.cpp stc_ml_c.h pystc/
          python setup.py build_ext --inplace
          ls -lh pystc/stc_extension*.so
      - name: Run one-image seven-variant smoke
        run: |
          mkdir -p /tmp/out
          SO=$(realpath research_v8/vendor/pystc_minimal/pystc/stc_extension*.so)
          python research_v8/src/run_v8_srm_shard.py             --boss-dir /tmp/boss/BOSSbase_1.01             --manifest research_v8/results/bossbase_split_manifest_v4.csv             --designs research_v8/results/v7_frozen_designs.json             --stc-so "$SO"             --srm-exe /tmp/srm/SRM_linux_make_v1.1/release/SRM             --start 0 --end 1 --jobs 1 --out-dir /tmp/out
          python - <<'PY'
          import glob,numpy as np,os,json
          fs=sorted(glob.glob('/tmp/out/*.npz'))
          assert len(fs)==7, len(fs)
          for f in fs:
              z=np.load(f)
              print(os.path.basename(f),z['X'].shape,z['success'].tolist(),z['message_bits'].tolist())
              assert z['X'].shape==(1,34671)
          print(open(glob.glob('/tmp/out/summary_*.json')[0]).read())
          PY
