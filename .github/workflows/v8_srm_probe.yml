name: V8 SRM DDE probe
on:
  push:
    branches: [cachin-ig-robust-v8]
    paths:
      - '.github/workflows/v8_srm_probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official DDE SRM and BOSSBase
        run: |
          set -euxo pipefail
          wget -q -O /tmp/SRM.tar https://dde.binghamton.edu/download/feature_extractors/download/SRM_linux_make_v1.1.tar
          mkdir -p /tmp/srm && tar -xf /tmp/SRM.tar -C /tmp/srm
          wget -q -O /tmp/BOSSBase.zip https://dde.binghamton.edu/download/ImageDB/BOSSbase_1.01.zip
          unzip -q /tmp/BOSSBase.zip -d /tmp/boss
          find /tmp/boss -type f -name '*.pgm' -print -quit
      - name: Build and probe CLI
        run: |
          set -euxo pipefail
          cd /tmp/srm
          for d in $(find . -type f \( -iname 'Makefile' -o -iname 'makefile' \) -printf '%h\n' | sort -u); do
            (cd "$d" && make) || true
          done
          EXE=/tmp/srm/SRM_linux_make_v1.1/release/SRM
          echo '=== executable ==='
          ls -lh "$EXE"
          echo '=== usage ==='
          "$EXE" || true
          echo '=== source usage strings ==='
          grep -RniE 'usage|argc|argv|program_options' /tmp/srm/SRM_linux_make_v1.1/src | head -80 || true
          echo '=== one-image probe ==='
          SAMPLE=$(find /tmp/boss -type f -name '*.pgm' -print -quit)
          mkdir -p /tmp/out
          /usr/bin/time -v "$EXE" "$SAMPLE" /tmp/out/sample.fea || true
          find /tmp/out -type f -ls || true
          if [ -f /tmp/out/sample.fea ]; then
            wc -c /tmp/out/sample.fea
            head -c 300 /tmp/out/sample.fea
            echo
          fi
